<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#102b25">
    <meta name="description" content="A private, offline income and expense tracker.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="stylesheet" href="styles.css">
    <title>Pocket Ledger</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">YOUR MONEY, CLEARLY</p>
          <h1>Pocket Ledger</h1>
        </div>
        <button id="installButton" class="icon-button hidden" aria-label="Install app" title="Install app">↓</button>
      </header>

      <section class="balance-card" aria-label="Balance summary">
        <p>Current balance</p>
        <strong id="balance">$0.00</strong>
        <div class="summary-grid">
          <div><span class="income-dot"></span><small>Income</small><b id="incomeTotal">$0.00</b></div>
          <div><span class="expense-dot"></span><small>Spent</small><b id="expenseTotal">$0.00</b></div>
        </div>
      </section>

      <section class="card add-card" aria-label="Add a transaction">
        <div class="section-heading"><h2>Add transaction</h2></div>
        <form id="transactionForm">
          <div class="type-toggle" role="group" aria-label="Transaction type">
            <button type="button" class="type-option active" data-type="expense">Expense</button>
            <button type="button" class="type-option" data-type="income">Income</button>
          </div>
          <label>Description<input id="description" maxlength="60" placeholder="e.g. Groceries" required></label>
          <div class="form-row">
            <label>Amount<input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required></label>
            <label>Category
              <select id="category"></select>
            </label>
          </div>
          <label>Date<input id="date" type="date" required></label>
          <button class="primary-button" type="submit">Add transaction</button>
        </form>
      </section>

      <section class="card transactions-card" aria-label="Transactions">
        <div class="section-heading"><h2>Recent activity</h2><button id="clearButton" class="text-button" type="button">Clear all</button></div>
        <div id="transactions" class="transactions"></div>
      </section>
    </main>
    <template id="transactionTemplate">
      <article class="transaction">
        <div class="transaction-icon"></div>
        <div class="transaction-details"><b></b><small></small></div>
        <div class="transaction-value"><b></b><button aria-label="Delete transaction" title="Delete transaction">×</button></div>
      </article>
    </template>
    <script src="app.js"></script>
  </body>
</html>
